<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WBS components preview</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="bundle.css">
<style>
  body{font-family:var(--font-sans);background:var(--surface);color:var(--ink);margin:0}
  .theme{padding:var(--space-9);border-bottom:1px solid var(--line)}
  .row{display:flex;flex-wrap:wrap;gap:var(--space-6);align-items:flex-start;margin:var(--space-6) 0}
  h2{font:600 20px/26px var(--font-sans)}
</style>
</head>
<body>
  <section class="theme" data-theme="light">
    <h1>Bone theme</h1>
    <div id="light-root"></div>
  </section>
  <section class="theme" data-theme="dark">
    <h1>Forest theme</h1>
    <div id="dark-root"></div>
  </section>
  <script src="bundle.js"></script>
  <script>
    function mount(root) {
      var row1 = document.createElement('div'); row1.className = 'row';
      row1.appendChild(WBS.Button({ label: 'Get a quote' }));
      row1.appendChild(WBS.Button({ label: 'Ghost', variant: 'ghost' }));
      row1.appendChild(WBS.Chip({ label: 'Landscape', active: true }));
      row1.appendChild(WBS.Chip({ label: 'Carpentry' }));
      root.appendChild(row1);

      var row2 = document.createElement('div'); row2.className = 'row';
      row2.appendChild(WBS.Card({ eyebrow: 'SERVICES', title: 'Decks', body: 'Built to last.', items: ['Cedar', 'Composite'] }));
      row2.appendChild(WBS.Field({ label: 'Email', name: 'email', type: 'email' }));
      row2.appendChild(WBS.Stat({ value: '30', label: 'Days warranty' }));
      root.appendChild(row2);

      var row3 = document.createElement('div'); row3.className = 'row';
      row3.appendChild(WBS.Eyebrow({ text: 'LANDSCAPE · CARPENTRY · BUILD' }));
      var q = WBS.Quote({ text: 'Cedar deck, day 3. On track for Friday.', attribution: 'Pablo Baldo' });
      if (q) row3.appendChild(q);
      root.appendChild(row3);

      var row4 = document.createElement('div'); row4.className = 'row';
      row4.appendChild(WBS.RidgelineDivider({ lit: [true, true, false] }));
      root.appendChild(row4);

      var nav = WBS.Nav({
        links: [
          { label: 'Services', href: '#services', current: true },
          { label: 'How we work', href: '#process' },
          { label: 'About', href: '#about' },
          { label: 'Recent work', href: '#work' },
          { label: 'FAQ', href: '#faq' }
        ],
        cta: { label: 'Get a quote', href: '#contact' },
        whatsapp: { label: 'WhatsApp', href: 'https://wa.me/64211822723' }
      });
      root.appendChild(nav.trigger);
      root.appendChild(nav.scrim);
      root.appendChild(nav.drawer);
    }
    mount(document.getElementById('light-root'));
    mount(document.getElementById('dark-root'));
  </script>
</body>
</html>
